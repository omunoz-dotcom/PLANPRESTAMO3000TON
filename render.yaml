# Blueprint de Render para la plataforma de Control de Silos (carpeta silos-app/).
services:
  - type: web
    name: silos-control
    runtime: docker
    rootDir: silos-app
    dockerfilePath: ./Dockerfile
    plan: starter            # el plan gratuito no admite disco persistente
    region: virginia
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: silos-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: UTC_OFFSET
        value: "-5"
      - key: SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # Render la pedirá al crear el servicio
